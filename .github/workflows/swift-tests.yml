name: Swift Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: swift test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run tests
        env:
          MDP_LAYOUT_ARTIFACTS: ${{ runner.temp }}/md-preview-layout-failures
        run: swift test --package-path tests/swift-tests

      - name: Test editor transition callback ordering
        run: python3 tests/test-mode-transitions.py

      - name: Upload WebKit layout diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: webkit-layout-failures
          path: ${{ runner.temp }}/md-preview-layout-failures
          if-no-files-found: ignore
