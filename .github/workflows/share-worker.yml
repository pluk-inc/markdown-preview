name: Share Worker

on:
  pull_request:
    paths:
      - server/share-worker/**
      - tests/fixtures/share-link/**
      # The web viewer ships the app's vendor scripts.
      - md-preview/Vendor/**
      - .github/workflows/share-worker.yml
  push:
    branches: [main]
    paths:
      - server/share-worker/**
      - tests/fixtures/share-link/**
      - md-preview/Vendor/**
      - .github/workflows/share-worker.yml

permissions:
  contents: read

jobs:
  test:
    name: worker test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/share-worker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/share-worker/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Deploys main to the md-preview.app routes. Skips with a notice until the
  # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist; see
  # server/share-worker/README.md, "Deploy". The share-worker environment
  # requires a reviewer, so the job waits for approval before it deploys.
  deploy:
    name: worker deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: share-worker
      url: https://md-preview.app/s/
    runs-on: ubuntu-latest
    concurrency: share-worker-deploy
    defaults:
      run:
        working-directory: server/share-worker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/share-worker/package-lock.json

      - run: npm ci

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set; skipping the deploy."
            exit 0
          fi
          # The Cloudflare API sometimes fails a request with an unknown
          # error (code 10013). A deploy is safe to repeat, so try again.
          for attempt in 1 2 3; do
            npm run deploy && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Deploy attempt $attempt failed; trying again in $((attempt * 30)) s."
              sleep $((attempt * 30))
            fi
          done
          exit 1
