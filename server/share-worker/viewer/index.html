<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Shared document · Markdown Preview</title>
<link rel="stylesheet" href="/s/_viewer/generated/markdown.css">
<link rel="stylesheet" href="/s/_viewer/vendor/katex.min.css">
<link rel="stylesheet" href="/s/_viewer/viewer.css">
<script src="/s/_viewer/vendor/purify.min.js" defer></script>
<script src="/s/_viewer/vendor/highlight.min.js" defer></script>
<script src="/s/_viewer/vendor/katex.min.js" defer></script>
<script src="/s/_viewer/generated/renderers.js" defer></script>
<script type="module" src="/s/_viewer/main.js"></script>
</head>
<body>
<header class="mdp-share-bar">
  <span class="mdp-share-brand" data-l10n="brand">Shared with Markdown Preview</span>
  <span id="doc-title" class="mdp-share-title"></span>
  <nav class="mdp-share-actions">
    <a id="download" class="mdp-share-button" hidden><span class="mdp-share-long" data-l10n="download">Download .md</span><span class="mdp-share-short" data-l10n="downloadShort">.md</span></a>
    <a id="open-in-app" class="mdp-share-button mdp-share-primary" href="https://markdownpreview.app"><span class="mdp-share-long" data-l10n="open">Open in Markdown Preview</span><span class="mdp-share-short" data-l10n="openShort">Open in App</span></a>
  </nav>
</header>
<p id="notice" class="mdp-share-notice" hidden></p>
<p id="status" class="mdp-share-status" hidden></p>
<article class="markdown-body"></article>
<footer class="mdp-share-footer">
  <span data-l10n="footer">This document is encrypted. Only people with the link can read it, and the server cannot.</span>
  <a href="https://markdownpreview.app" data-l10n="getApp">Get Markdown Preview</a>
</footer>
</body>
</html>
