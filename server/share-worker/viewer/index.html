<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Shared document · Markdown Preview</title>
<script src="/s/_viewer/boot.js"></script>
<link rel="stylesheet" href="/s/_viewer/generated/markdown.css">
<link rel="stylesheet" href="/s/_viewer/viewer.css">
<link rel="modulepreload" href="/s/_viewer/share-crypto.js">
<link rel="modulepreload" href="/s/_viewer/payload.js">
<link rel="modulepreload" href="/s/_viewer/strings.js">
<script src="/s/_viewer/vendor/purify.min.js" defer></script>
<script src="/s/_viewer/generated/renderers.js" defer></script>
<script type="module" src="/s/_viewer/main.js"></script>
</head>
<body>
<header class="bar">
  <button id="toggle-contents" class="icon-button" type="button" data-l10n-label="toggleContents">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h7"/></svg>
  </button>
  <nav class="crumbs">
    <span class="crumb-origin" data-l10n="sharedWithYou">Shared with you</span>
    <svg class="crumb-sep" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
    <span id="doc-title" class="crumb-title"></span>
  </nav>
  <div class="actions">
    <div class="reading">
      <button id="reading-button" class="icon-button text-button" type="button" aria-expanded="false" aria-controls="reading-panel" data-l10n-label="readingOptions">Aa</button>
      <div id="reading-panel" class="reading-panel" hidden>
        <div class="panel-row">
          <span class="panel-row-label" data-l10n="textSize">Text size</span>
          <div class="size-control">
            <div class="capsule">
              <button id="text-smaller" type="button" data-l10n-label="smaller"><span class="small-a">A</span></button>
              <span class="capsule-divider" aria-hidden="true"></span>
              <button id="text-larger" type="button" data-l10n-label="larger"><span class="large-a">A</span></button>
            </div>
            <span id="text-size-dots" class="dots" aria-hidden="true"></span>
          </div>
        </div>
        <div class="panel-row">
          <span class="panel-row-label" data-l10n="appearance">Appearance</span>
          <div class="segmented" role="radiogroup">
            <button id="appearance-automatic" type="button" role="radio" data-l10n-label="automatic">
              <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor" stroke="none"/></svg>
            </button>
            <button id="appearance-light" type="button" role="radio" data-l10n-label="light">
              <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.75"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1.06 1.06M11.54 11.54l1.06 1.06M3.4 12.6l1.06-1.06M11.54 4.46l1.06-1.06"/></svg>
            </button>
            <button id="appearance-dark" type="button" role="radio" data-l10n-label="dark">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 10.1A5.6 5.6 0 0 1 5.9 2.8a5.6 5.6 0 1 0 7.3 7.3z"/></svg>
            </button>
          </div>
        </div>
        <div class="panel-row">
          <span class="panel-row-label" data-l10n="width">Width</span>
          <div class="segmented" role="radiogroup">
            <button id="width-fixed" type="button" role="radio" data-l10n="fixedWidth">Fixed</button>
            <button id="width-full" type="button" role="radio" data-l10n="fullWidth">Full</button>
          </div>
        </div>
      </div>
    </div>
    <button id="copy-link" class="icon-button" type="button" data-l10n-label="copyLink">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.8 9.2a2.6 2.6 0 0 0 3.7 0l2.2-2.2a2.6 2.6 0 0 0-3.7-3.7l-.9.9M9.2 6.8a2.6 2.6 0 0 0-3.7 0L3.3 9a2.6 2.6 0 0 0 3.7 3.7l.9-.9"/></svg>
    </button>
    <a id="download" class="icon-button" data-l10n-label="download">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v7.5M4.8 7 8 10.2 11.2 7M3 13h10"/></svg>
    </a>
    <a id="open-in-app" class="open-button" href="https://markdownpreview.app"><span class="long" data-l10n="open">Open in Markdown Preview</span><span class="short" data-l10n="openShort">Open in App</span></a>
  </div>
</header>
<div class="workspace">
<nav id="contents" class="contents">
  <p class="panel-label" data-l10n="contents">Contents</p>
  <ol id="contents-list"></ol>
  <p id="contents-empty" class="contents-empty" data-l10n="noHeadings" hidden>No headings</p>
</nav>
<main class="sheet">
  <p class="loading" role="status" data-l10n="loading">Loading…</p>
  <div class="page">
    <p id="notice" class="notice" hidden></p>
    <div id="status" class="status" hidden>
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 14V10.5a7 7 0 0 1 14 0V14M7.5 14h17v12.5h-17z"/></svg>
      <p id="status-text"></p>
    </div>
    <article class="markdown-body"></article>
  </div>
</main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
